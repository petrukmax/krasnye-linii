name: Materialize exact 1.zip site in main

on:
  push:
    branches: [main]
    paths:
      - '1.zip'
      - '.github/workflows/materialize-1zip-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Extract exact site from 1.zip
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _unpack
          mkdir -p _unpack
          unzip -q 1.zip -d _unpack

          mapfile -d '' candidates < <(find _unpack -type f -name index.html -print0)
          test "${#candidates[@]}" -gt 0

          chosen=""
          for f in "${candidates[@]}"; do
            d="$(dirname "$f")"
            if [ -f "$d/style.css" ] && [ -d "$d/img" ]; then
              if [[ "$d" == */public/archive ]]; then
                chosen="$d"
                break
              fi
              [ -z "$chosen" ] && chosen="$d"
            fi
          done

          test -n "$chosen"
          echo "Using exact site directory: $chosen"

          # Remove previously materialized site files but keep the uploaded
          # 1.zip, repository metadata, workflows, and helper bundles.
          find . -mindepth 1 -maxdepth 1             ! -name '.git'             ! -name '.github'             ! -name '1.zip'             ! -name 'README.md'             ! -name 'archive.bundle.part01'             ! -name 'archive.bundle.part02'             ! -name 'archive.bundle.part03'             ! -name 'archive.bundle.part04'             ! -name 'archive.bundle.part05'             ! -name 'archive.bundle.part06'             ! -name 'payload'             -exec rm -rf {} +

          cp -a "$chosen"/. .

          touch .nojekyll
          rm -rf _unpack

          test -f index.html
          test -f style.css
          test -d img

          # Verify all internal href/src targets are present.
          python3 - <<'PY'
          import os, re, urllib.parse, sys
          missing = []
          for root, _, files in os.walk('.'):
              if root.startswith('./.git') or root.startswith('./.github'):
                  continue
              for fn in files:
                  if not fn.lower().endswith(('.html','.htm','.css')):
                      continue
                  path=os.path.join(root,fn)
                  try:
                      text=open(path,encoding='utf-8',errors='ignore').read()
                  except Exception:
                      continue
                  for m in re.finditer(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', text, re.I):
                      u=m.group(1)
                      if u.startswith(('#','http:','https:','mailto:','javascript:','data:')):
                          continue
                      u=urllib.parse.unquote(u.split('#',1)[0].split('?',1)[0])
                      if not u:
                          continue
                      target=os.path.normpath(os.path.join(os.path.dirname(path),u))
                      if not os.path.exists(target):
                          missing.append(f'{path} -> {u}')
          if missing:
              print('\n'.join(missing))
              sys.exit(f'Found {len(missing)} broken internal link(s)')
          print('Internal link audit: OK')

      - name: Commit materialized site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: materialize exact 1.zip site [skip ci]"
          git push
